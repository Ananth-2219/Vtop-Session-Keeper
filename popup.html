
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VTOP Session Keeper</title>
  <style>
    body {
      width: 270px;
      margin: 0;
      padding: 16px;
      color: #202124;
      background: #fff;
      font: 14px/1.45 system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    input {
      width: 17px;
      height: 17px;
    }

    #status {
      margin-top: 12px;
      color: #4b5563;
    }

    .note {
      margin-top: 10px;
      color: #6b7280;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>VTOP Session Keeper v2</h1>

  <label class="toggle">
    <input id="enabled" type="checkbox">
    <span>Enable session monitoring</span>
  </label>

  <div id="status">Checking VTOP tabs...</div>

  <div class="note">
    After 9 minutes of inactivity, the extension attempts
    a Curriculum request and returns to the VTOP Home page.
  </div>

  <script src="popup.js"></script>
</body>
</html>
